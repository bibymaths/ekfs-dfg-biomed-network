[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ekfs-dfg-biomed-network"
version = "0.1.0"
description = "Reproducible multi-layer network analysis and career funding trajectories for EKFS and DFG biomedical research cohorts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" }
]
keywords = [
    "network-science",
    "bibliometrics",
    "science-of-science",
    "biomedical-research",
    "openalex",
    "ekfs",
    "dfg",
    "gepris"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0"
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]